services:
  postgres:
    image: postgres:16-alpine
    container_name: nuonetdisk-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nuonetdisk}
      POSTGRES_USER: ${POSTGRES_USER:-nuonetdisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuonetdisk_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuonetdisk"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nuonetdisk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nuonetdisk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nuonetdisk_dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nuonetdisk-backend
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: "postgres://nuonetdisk:nuonetdisk_dev@postgres:5432/nuonetdisk?sslmode=disable"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "nuonetdisk"
      MINIO_SECRET_KEY: "nuonetdisk_dev"
      MINIO_BUCKET: "nuonetdisk"
      MINIO_USE_SSL: "false"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      JWT_ACCESS_EXPIRY: "15m"
      JWT_REFRESH_EXPIRY: "720h"
      MAX_UPLOAD_SIZE: "104857600"
      LOG_LEVEL: "debug"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
