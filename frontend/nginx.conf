resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # API proxy to backend
    # NOTE: proxy_pass uses only the variable here (no URI part). When proxy_pass
    # contains a variable, nginx disables automatic location-prefix replacement.
    # Adding a URI (e.g. "$backend_upstream/api/") would double the path
    # (/api/api/v1/...) and break all backend routes. With just the variable,
    # nginx forwards the original request URI unchanged, which is what the
    # backend expects (/api/v1/...).
    set $backend_upstream http://backend:8080;
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 100m;
    }

    # Static assets with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
